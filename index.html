<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Job Search HQ</title>
    <script>
      // Telegram's SDK is only needed inside the Mini App. Loading it for every
      // visit blocked first paint on telegram.org, so inject it (async) only
      // when launched from Telegram. Same signals App.tsx uses for isMiniApp.
      (function () {
        var h = location.hash + location.search;
        if (location.pathname.indexOf("/miniapp") !== 0 && h.indexOf("tgWebAppData") === -1) return;
        var s = document.createElement("script");
        s.src = "https://telegram.org/js/telegram-web-app.js";
        s.async = true;
        s.onload = function () {
          try {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
          } catch (e) {}
        };
        document.head.appendChild(s);
      })();
    </script>
    <script>
      // Daily-rotating favicon: same emoji all day, changes at local midnight.
      (function () {
        var EMOJIS = ["💼", "🎯", "📌", "🚀", "🔍", "🧭", "📈", "🏆", "✅", "🗂️", "📋", "🔑"];
        var today = new Date();
        var seed = today.getFullYear() * 372 + today.getMonth() * 31 + today.getDate();
        var emoji = EMOJIS[seed % EMOJIS.length];
        var svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
          '<text x="50" y="50" font-size="72" text-anchor="middle" dominant-baseline="central">' +
          emoji +
          "</text></svg>";
        var link = document.createElement("link");
        link.rel = "icon";
        link.type = "image/svg+xml";
        link.href = "data:image/svg+xml," + encodeURIComponent(svg);
        document.head.appendChild(link);
      })();
    </script>
    <script>
      // Instant theme detection before first paint to prevent dark/light theme flash
      (function () {
        try {
          var savedTheme = localStorage.getItem('theme_pref');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          var visualTheme = localStorage.getItem('visual_theme');
          // Same rule as App.tsx: a saved bauhaus/cyber needs no attribute here, pulse is set, anything else is the default (matcha).
          if (visualTheme === 'pulse') document.documentElement.setAttribute('data-theme', 'pulse');
          else if (visualTheme !== 'bauhaus' && visualTheme !== 'cyber') document.documentElement.setAttribute('data-theme', 'matcha');
        } catch (e) {}
      })();
    </script>
    <script>
      // Global error listener to visibly display any startup errors on screen
      window.addEventListener('error', function (e) {
        var el = document.getElementById('app-splash');
        if (el) {
          var div = document.getElementById('splash-error-box');
          if (!div) {
            div = document.createElement('div');
            div.id = 'splash-error-box';
            div.style.cssText = 'color:#ff5555;font-size:12px;padding:12px;max-width:90%;word-break:break-all;text-align:center;margin-top:16px;background:rgba(0,0,0,0.6);border-radius:8px;font-family:monospace;';
            el.appendChild(div);
          }
          div.textContent = '❌ Script Error: ' + (e.message || e.error || 'Unknown script error');
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var el = document.getElementById('app-splash');
        if (el) {
          var div = document.getElementById('splash-error-box');
          if (!div) {
            div = document.createElement('div');
            div.id = 'splash-error-box';
            div.style.cssText = 'color:#ff5555;font-size:12px;padding:12px;max-width:90%;word-break:break-all;text-align:center;margin-top:16px;background:rgba(0,0,0,0.6);border-radius:8px;font-family:monospace;';
            el.appendChild(div);
          }
          div.textContent = '❌ Promise Error: ' + (e.reason?.message || e.reason || 'Unhandled rejection');
        }
      });
      setTimeout(function () {
        var splash = document.getElementById('app-splash');
        if (splash && !document.getElementById('splash-reload-btn')) {
          var btn = document.createElement('button');
          btn.id = 'splash-reload-btn';
          btn.style.cssText = 'margin-top:20px;padding:8px 16px;border-radius:8px;background:#d02020;color:#fff;border:none;font-size:12px;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);';
          btn.textContent = '🔄 Reload App';
          btn.onclick = function () {
            window.location.reload();
          };
          splash.appendChild(btn);
        }
      }, 4000);
    </script>
  </head>
  <body>
    <!--
      THESIS: A job search is a small number of live threads, each owing you a
      next move. This surface shows the pipeline as calm, generous rows you can
      read at a glance, and refuses the dense dashboard-of-widgets arrangement
      that treats six applications like six thousand.
    -->
    <div id="root">
      <div id="app-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;z-index:9999;user-select:none;">
        <style>
          #app-splash {
            background-color: #f0f0f0;
            color: #121212;
          }
          .dark #app-splash {
            background-color: #121212;
            color: #f0f0f0;
          }
          [data-theme="pulse"] #app-splash {
            background-color: #fbf7ff;
            color: #16131f;
          }
          .dark[data-theme="pulse"] #app-splash {
            background-color: #120f1d;
            color: #f4f1fc;
          }
          [data-theme="matcha"] #app-splash {
            background-color: #f6f4ec;
            color: #16190f;
          }
          .dark[data-theme="matcha"] #app-splash {
            background-color: #0d0f0b;
            color: #eceae0;
          }
          .splash-mark {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
          }
          .splash-circle {
            width: 12px;
            height: 12px;
            border-radius: 9999px;
            background: #d02020;
            animation: splashPulse 1.2s ease-in-out infinite alternate;
          }
          .splash-square {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            background: #0f805e;
            animation: splashPulse 1.2s ease-in-out 0.2s infinite alternate;
          }
          .splash-triangle {
            width: 12px;
            height: 12px;
            background: #f0c020;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            animation: splashPulse 1.2s ease-in-out 0.4s infinite alternate;
          }
          @keyframes splashPulse {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.18); opacity: 1; }
          }
          .splash-title {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
          }
          [data-theme="matcha"] .splash-title span {
            display: none;
          }
          .splash-progress {
            margin-top: 18px;
            width: 140px;
            height: 3px;
            border-radius: 9999px;
            background: rgba(128,128,128,0.18);
            overflow: hidden;
            position: relative;
          }
          .splash-bar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 40%;
            background: #d02020;
            border-radius: 9999px;
            animation: splashSlide 1.2s ease-in-out infinite;
          }
          [data-theme="pulse"] .splash-bar {
            background: linear-gradient(90deg, #6d3cff, #ff3d94);
          }
          [data-theme="matcha"] .splash-bar {
            background: #3f6b00;
          }
          .dark[data-theme="matcha"] .splash-bar {
            background: #c6f04d;
          }
          @keyframes splashSlide {
            0% { left: -40%; width: 30%; }
            50% { width: 50%; }
            100% { left: 100%; width: 30%; }
          }
        </style>
        <div class="splash-mark">
          <div class="splash-circle"></div>
          <div class="splash-square"></div>
          <div class="splash-triangle"></div>
        </div>
        <div class="splash-title">
          Job Search HQ
          <span style="font-size: 14px;">🎯</span>
        </div>
        <div class="splash-progress">
          <div class="splash-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
